# Static analysis configuration for the WheelAthlete app.
# `flutter analyze` runs these checks; they should stay clean (and gate CI).
include: package:flutter_lints/flutter.yaml

analyzer:
  # Strict type checking — surfaces implicit dynamic, weak inference, and raw
  # generic types that flutter_lints alone won't catch.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat fire-and-forget futures and missing await as errors, not hints.
    unawaited_futures: error

linter:
  rules:
    # Immutability / correctness
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    unawaited_futures: true
    # API hygiene
    always_declare_return_types: true
    avoid_catches_without_on_clauses: true
    always_use_package_imports: true
    use_super_parameters: true
    sort_child_properties_last: true
