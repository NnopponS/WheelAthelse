name: WheelAthlete Source Verification

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: ['feature/dual-imu-coaching-analysis']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Project hygiene and Windows source tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r applications/wheelathlete_windows/tools/pc_gui/requirements.txt
          python -m pip install -r applications/wheelathlete_windows/tools/pc_gui/requirements-model.txt
          python -m pip install -r applications/wheelathlete_windows/tools/pc_acquisition/requirements.txt
      - name: Check project structure and publication boundary
        run: python scripts/run_verification.py --suite project
      - name: Test Windows GUI and acquisition
        run: python scripts/run_verification.py --suite windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: .project/local/verification/
          include-hidden-files: true
          retention-days: 7

  mobile:
    name: Flutter analysis and source tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: applications/wheelathlete_mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test the mobile source
        run: python scripts/run_verification.py --suite mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-verification
          path: .project/local/verification/
          include-hidden-files: true
          retention-days: 7

# This workflow only verifies source. It has no signing secrets, device access,
# release permissions, packaging or publishing step. Stable release automation
# remains separate in release.yml and is not triggered by this feature push.
