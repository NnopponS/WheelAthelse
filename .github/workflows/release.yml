name: WheelAthlete Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheelathlete-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Test shared update manifest generator
        run: python -m unittest release.test_generate_update_manifest

      - id: meta
        name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          ref = os.environ.get('GITHUB_REF_NAME', '')
          if ref != f'v{version}':
              raise SystemExit(
                  f'Release workflow must be dispatched on exact tag v{version}; got {ref!r}'
              )
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as stream:
              stream.write(f'version={version}\n')
          PY

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          python -m pip install -r applications/wheelathlete_windows/tools/pc_gui/requirements.txt
          python -m pip install -r applications/wheelathlete_windows/tools/pc_gui/requirements-model.txt
          python -m pip install -r applications/wheelathlete_windows/tools/pc_acquisition/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Import trusted Windows signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.WHEELATHLETE_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WHEELATHLETE_SIGN_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WHEELATHLETE_TIMESTAMP_URL }}
          EXPECTED_SUBJECT: ${{ vars.WHEELATHLETE_SIGN_CERT_SUBJECT }}
        run: |
          if (-not $env:SIGN_PFX_BASE64 -or -not $env:SIGN_PFX_PASSWORD -or -not $env:TIMESTAMP_URL -or -not $env:EXPECTED_SUBJECT) {
            throw "Trusted Windows signing secrets, expected subject, and timestamp URL are required for publication."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "wheelathlete-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $signingCertificates = @($imported | Where-Object HasPrivateKey)
            if ($signingCertificates.Count -ne 1) {
              throw "Signing PFX must contain exactly one certificate with a private key."
            }
            $certificate = $signingCertificates[0]
            "WHEELATHLETE_SIGN_CERT_SHA1=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
            "WHEELATHLETE_TIMESTAMP_URL=$env:TIMESTAMP_URL" >> $env:GITHUB_ENV
            "WHEELATHLETE_SIGN_CERT_SUBJECT=$env:EXPECTED_SUBJECT" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Test Windows application
        working-directory: applications/wheelathlete_windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tools/pc_gui/tests tools/pc_acquisition/tests
          python -m compileall -q tools/pc_gui tools/pc_acquisition

      - name: Build Windows installer
        working-directory: applications/wheelathlete_windows
        shell: cmd
        run: packaging\windows\build_installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            applications/wheelathlete_windows/release/WheelAthleteSetup-${{ needs.metadata.outputs.version }}.exe
            applications/wheelathlete_windows/release/WheelAthlete-${{ needs.metadata.outputs.version }}-portable.zip
            applications/wheelathlete_windows/release/signing-report.json
            applications/wheelathlete_windows/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [metadata, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Re-check public signing gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('dist/signing-report.json').read_text(encoding='utf-8'))
          if report.get('public_release_ready') is not True:
              raise SystemExit('signing-report.json did not pass public_release_ready')
          PY

      - name: Generate verified-artifact update manifest
        shell: bash
        run: |
          python release/generate_update_manifest.py \
            --version "${{ needs.metadata.outputs.version }}" \
            --windows "dist/WheelAthleteSetup-${{ needs.metadata.outputs.version }}.exe" \
            --out dist/latest.json \
            --notes "WheelAthlete ${{ needs.metadata.outputs.version }} Windows release; mobile is under maintenance"
          cat dist/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: WheelAthlete v${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          files: |
            dist/WheelAthleteSetup-${{ needs.metadata.outputs.version }}.exe
            dist/WheelAthlete-${{ needs.metadata.outputs.version }}-portable.zip
            dist/signing-report.json
            dist/SHA256SUMS.txt
            dist/latest.json
