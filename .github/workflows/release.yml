name: WheelAthlete Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      android_build: ${{ steps.meta.outputs.android_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Test shared update manifest generator
        run: python -m unittest release.test_generate_update_manifest

      - id: meta
        name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          pubspec = Path('applications/wheelathlete_mobile/pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+(\d+)\s*$', pubspec, re.M)
          if not match:
              raise SystemExit('Could not read Flutter version/build from pubspec.yaml')
          if match.group(1) != version:
              raise SystemExit(f'Flutter version {match.group(1)} != root VERSION {version}')
          ref = os.environ.get('GITHUB_REF_NAME', '')
          if ref.startswith('v') and ref != f'v{version}':
              raise SystemExit(f'Tag {ref} != v{version}')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as stream:
              stream.write(f'version={version}\n')
              stream.write(f'android_build={match.group(2)}\n')
          PY

  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare persistent Android release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wheelathlete-release.jks"

      - name: Test and build Android release
        working-directory: applications/wheelathlete_mobile
        env:
          WHEELATHLETE_KEYSTORE_PATH: ${{ runner.temp }}/wheelathlete-release.jks
          WHEELATHLETE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WHEELATHLETE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WHEELATHLETE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "WheelAthlete-Android-${{ needs.metadata.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: applications/wheelathlete_mobile/WheelAthlete-Android-${{ needs.metadata.outputs.version }}.apk
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          python -m pip install -r applications/wheelathlete_windows/tools/pc_gui/requirements.txt
          python -m pip install -r applications/wheelathlete_windows/tools/pc_acquisition/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Test Windows application
        working-directory: applications/wheelathlete_windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tools/pc_gui/tests tools/pc_acquisition/tests
          python -m compileall -q tools/pc_gui tools/pc_acquisition

      - name: Build Windows installer
        working-directory: applications/wheelathlete_windows
        shell: cmd
        run: packaging\windows\build_installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: applications/wheelathlete_windows/release/WheelAthleteSetup-${{ needs.metadata.outputs.version }}.exe
          if-no-files-found: error

  publish:
    needs: [metadata, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Generate verified-artifact update manifest
        shell: bash
        env:
          IOS_UPDATE_URL: ${{ vars.WHEELATHLETE_IOS_UPDATE_URL }}
        run: |
          python release/generate_update_manifest.py \
            --version "${{ needs.metadata.outputs.version }}" \
            --android "dist/WheelAthlete-Android-${{ needs.metadata.outputs.version }}.apk" \
            --android-build "${{ needs.metadata.outputs.android_build }}" \
            --windows "dist/WheelAthleteSetup-${{ needs.metadata.outputs.version }}.exe" \
            --out dist/latest.json \
            --notes "WheelAthlete ${{ needs.metadata.outputs.version }} stable release" \
            --ios-url "$IOS_UPDATE_URL"
          cat dist/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: WheelAthlete v${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          files: |
            dist/WheelAthlete-Android-${{ needs.metadata.outputs.version }}.apk
            dist/WheelAthleteSetup-${{ needs.metadata.outputs.version }}.exe
            dist/latest.json
