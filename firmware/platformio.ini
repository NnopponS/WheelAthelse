; WheelSense Firmware — M5StickCPlus2 (ESP32)
; Subtask #2: IMU acquisition via MPU6886 FIFO + data-ready, serial CSV debug
; BLE will be added in subtask #3

[platformio]
default_envs = left

[env]
platform          = espressif32
board             = m5stick-c
framework         = arduino
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified @ ^0.1.16

build_flags =
    -std=c++17
    -DCORE_DEBUG_LEVEL=3
    -DWHEELSENSE_FW_MAJOR=0
    -DWHEELSENSE_FW_MINOR=2
    -DWHEELSENSE_FW_PATCH=0

; ── Wheel left ──────────────────────────────────────────────
[env:left]
build_flags =
    ${env.build_flags}
    -DWHEEL_ID=0x4C    ; 'L' (ASCII 76)

; ── Wheel right ─────────────────────────────────────────────
[env:right]
build_flags =
    ${env.build_flags}
    -DWHEEL_ID=0x52    ; 'R' (ASCII 82)
