; WheelAthlete Firmware — M5StickCPlus2 (ESP32)
; Subtask #2: IMU acquisition via MPU6886 FIFO + data-ready, serial CSV debug
; BLE will be added in subtask #3

[platformio]
default_envs = left

; ── Common build flags for ESP32 (left/right) ────────────────
[espressif_base]
platform          = espressif32
board             = m5stick-c
framework         = arduino
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder
lib_deps          =
    m5stack/M5Unified @ ^0.1.16
    h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
    -std=c++17
    -DCORE_DEBUG_LEVEL=3
    -DWheelAthlete_FW_MAJOR=1
    -DWheelAthlete_FW_MINOR=8
    -DWheelAthlete_FW_PATCH=0

; ── Wheel left ──────────────────────────────────────────────
[env:left]
extends    = espressif_base
build_flags =
    ${espressif_base.build_flags}
    -DWHEEL_ID=0x4C    ; 'L' (ASCII 76)

; ── Wheel right ─────────────────────────────────────────────
[env:right]
extends    = espressif_base
build_flags =
    ${espressif_base.build_flags}
    -DWHEEL_ID=0x52    ; 'R' (ASCII 82)

; ── Host-side unit tests (no hardware needed) ───────────────
; Tests pure logic from imu_types.h: struct size, scale tables,
; rate math, FIFO byte parsing, timestamp interpolation.
[env:native]
platform        = native
build_flags     = -std=c++17 -DTARGET_NATIVE=1 -Isrc
build_unflags   = -std=gnu++11
test_framework  = unity
