; PlatformIO Project Configuration File
; WheelAthlete Firmware — Seeed Xiao BLE Sense (nRF52840)

[platformio]
default_envs = left

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
framework = arduino

[nrf52_base]
board = xiaoblesense_adafruit
lib_deps =
  https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git
  olikraus/U8g2@^2.35.7
monitor_speed = 115200
build_flags =
  -std=c++17
  -DWheelAthlete_FW_MAJOR=1
  -DWheelAthlete_FW_MINOR=7
  -DWheelAthlete_FW_PATCH=0

[env:left]
extends = nrf52_base
build_flags =
  ${nrf52_base.build_flags}
  -DWHEEL_ID=0x4C    ; 'L' (ASCII 76)

[env:right]
extends = nrf52_base
build_flags =
  ${nrf52_base.build_flags}
  -DWHEEL_ID=0x52    ; 'R' (ASCII 82)
